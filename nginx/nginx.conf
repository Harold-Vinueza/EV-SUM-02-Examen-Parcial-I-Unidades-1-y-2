events {
    worker_connections 1024;
}

http {
    # Puerta de entrada única del sistema (patrón API Gateway simplificado).
    # Solo Nginx está expuesto al host; los microservicios y las BD viven
    # únicamente en la red interna 'mercadoquevedo-net'.

    upstream catalogo_upstream {
        server svc-catalogo:8000;
    }

    upstream pedidos_upstream {
        server svc-pedidos:8000;
    }

    server {
        listen 80;

        location /api/v1/productos {
            proxy_pass http://catalogo_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/pedidos {
            proxy_pass http://pedidos_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Documentación Swagger de cada servicio, expuesta a través del gateway
        location /docs/catalogo/ {
            proxy_pass http://catalogo_upstream/api/v1/docs;
        }

        location /docs/pedidos/ {
            proxy_pass http://pedidos_upstream/api/v1/docs;
        }

        location /health {
            return 200 '{"status":"ok","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
